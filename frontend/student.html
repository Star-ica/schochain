<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student dashboard — SchoChain</title><link rel="stylesheet" href="css/styles.css"></head><body>
<main class="wrap">
  <div class="page-head"><h1 style="font-size:2.2rem">Student dashboard</h1><p class="muted">Track applications, see decisions and claim approved awards.</p></div>
  <div id="gate"></div>
  <div class="tabs" role="tablist"><button class="on" data-t="active">Active</button><button data-t="history">Previous applications &amp; awards</button></div>
  <div id="list" class="grid"></div>
</main>
<script src="js/vendor/ethers.umd.min.js"></script><script src="js/deployment.js"></script><script src="js/abi.js"></script><script src="js/app.js"></script>
<script>
(async () => {
  const { layout, S, C, esc, $, $$, short, fmtAmt, fmtDate, fmtDateTime, now, connect, send, loading, loadProgram, statusChip, timeline, errMsg, STATUS, deployed } = SCHO;
  layout("student.html");
  let tab = "active", items = [];
  const FINAL = [4, 5, 6, 7, 8];
  async function load() {
    const gate = $("#gate"), list = $("#list");
    if (!deployed) { list.innerHTML = '<div class="empty">Contracts not deployed yet.</div>'; return; }
    if (!S.account) { gate.innerHTML = '<div class="callout info"><strong>Connect your wallet</strong>Your applications are linked to your wallet address.</div><button class="btn" id="cw">Connect wallet</button>'; $("#cw").onclick = () => connect(false).then(load); list.innerHTML = ""; return; }
    gate.innerHTML = `<p class="small muted">Wallet <span class="mono">${S.account}</span></p>`;
    loading(list);
    try {
      const refs = await C.appReg().applicationsOf(S.account);
      items = await Promise.all(refs.map(async (r) => {
        const pr = await loadProgram(r.program); const a = await C.program(r.program).getApplication(r.appId);
        return { addr: r.program, id: r.appId, pr, a };
      }));
      items.reverse(); render();
    } catch (e) { list.innerHTML = '<div class="empty">' + esc(errMsg(e)) + "</div>"; }
  }
  function render() {
    const list = $("#list");
    const rows = items.filter((x) => (tab === "history" ? FINAL.includes(Number(x.a.status)) : !FINAL.includes(Number(x.a.status)) ));
    if (!rows.length) { list.innerHTML = `<div class="empty">${tab === "history" ? "No previous applications or awards." : 'No active applications. <a href="explorer.html">Browse scholarships</a>'}</div>`; return; }
    list.innerHTML = rows.map((x, i) => {
      const { pr, a } = x, s = Number(a.status), o = pr.o, t = pr.t;
      const claimable = s === 3 && Number(a.claimDeadline) >= now();
      let note = "";
      if (s === 1 || s === 2) note = `Awaiting review and a published decision (${a.reviewCount}/${o.requiredReviews} reviews).`;
      if (s === 3) note = claimable ? `Approved! Claim ${esc(fmtAmt(o.awardAmount, t))} before ${esc(fmtDateTime(a.claimDeadline))}.` : "Approved, but the claim window has closed.";
      if (s === 4) note = "Not selected this time.";
      if (s === 5) note = `Paid ${esc(fmtAmt(o.awardAmount, t))} on ${esc(fmtDate(a.claimedAt))}.`;
      if (s === 8) note = "The provider cancelled this program.";
      if (s === 7) note = "The claim window expired; funds returned to the pool.";
      return `<article class="card"><div class="inline" style="justify-content:space-between"><h3 style="margin:0"><a href="scholarship.html?p=${x.addr}" style="color:inherit">${esc(o.title)}</a></h3>${statusChip(s)}</div>
        <p class="small muted">Application #${x.id} · submitted ${esc(fmtDate(a.submittedAt))}</p>${SCHO.timeline(s)}
        <p>${note}</p><p class="mono small muted">Document hash: ${a.docHash}</p>
        <div class="inline">${claimable ? `<button class="btn accent" data-claim="${i}">Claim award</button>` : ""}
        ${(s === 1 || s === 2) && Number(a.decision) === 0 ? `<button class="btn secondary sm" data-wd="${i}">Withdraw application</button>` : ""}</div></article>`;
    }).join("");
    $$("[data-claim]").forEach((b) => b.onclick = async () => { const x = rows[b.dataset.claim]; try { await send("Claim", () => C.program(x.addr, true).claim(x.id), b); load(); } catch {} });
    $$("[data-wd]").forEach((b) => b.onclick = async () => { const x = rows[b.dataset.wd]; if (!confirm("Withdraw this application? You cannot re-apply to this scholarship.")) return; try { await send("Withdraw", () => C.program(x.addr, true).withdrawApplication(x.id), b); load(); } catch {} });
  }
  $$(".tabs button").forEach((b) => b.onclick = () => { tab = b.dataset.t; $$(".tabs button").forEach((c) => c.classList.toggle("on", c === b)); render(); });
  await connect(true); await load();
})();
</script></body></html>
